# Images werden über host.env überschrieben (die Skripte exportieren sie).
# Feste Versionen, kein :latest - Aktualisieren ist eine bewusste Änderung.
name: profineo-proxy

services:
  nginx:
    image: ${NGINX_IMAGE:-nginx:1.30.7-alpine}
    container_name: profineo-proxy
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./letsencrypt:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./log:/var/log/nginx

  certbot:
    image: ${CERTBOT_IMAGE:-certbot/certbot:v5.7.0}
    profiles:
      - manuell
    volumes:
      - ./letsencrypt:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint:
      - certbot
