# Globale nginx-Konfiguration. Gilt für alle Instanzen auf diesem Host.
# Die Instanzen selbst stehen in conf.d/ und werden von scripts/render.sh
# erzeugt - dort nichts von Hand ändern.

user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # WebSocket (u. a. MDE-Erfassung): Upgrade nur weiterreichen, wenn angefragt
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Alle server-Blöcke (auch der Standard auf Port 80) stehen in conf.d/,
    # weil render.sh dort je nach host.env IPv6 mit einträgt.
    include /etc/nginx/conf.d/*.conf;
}
